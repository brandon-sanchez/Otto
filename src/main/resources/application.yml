otto:
  league-id: "1389748403805650944"
  username: "SenorMustache"
  storage-dir: "./data"
  sleeper:
    base-url: "https://api.sleeper.app"
  telegram:
    base-url: "https://api.telegram.org"
    bot-token: "${TELEGRAM_BOT_TOKEN:}"
    chat-id: "${TELEGRAM_CHAT_ID:}"
    webhook-secret: "${TELEGRAM_WEBHOOK_SECRET:}"
  nflverse:
    api-base-url: "https://api.github.com"
    download-base-url: "https://github.com"
    player-ids-base-url: "https://raw.githubusercontent.com"
    check-interval: 1h
  directory-check-interval: 60s
  pre-draft-check-interval: 24h
  # How stale a cached Sleeper read may be before a reader that is not
  # the Check goes back to the wire. It matches the Check's poll
  # interval: the Check keeps the cache filled, and the Freshness
  # Ceiling means a fresh poll would not be fresher anyway.
  sleeper-cadence: 60s
  edge-threshold: 1.0
  # A dropped player inside these ranks of the weekly projection table is
  # league news. The quarterback line stays at 12: this league starts two
  # of them, so a top-12 quarterback is a starter on most rosters.
  notable-cutoffs:
    qb: 12
    rb: 24
    wr: 24
    te: 12
  # What a startable player is worth, by the rank a league of this shape
  # can fill. Superflex makes about 24 quarterbacks startable, so the
  # quarterback line sits with the running backs and receivers.
  replacement-cutoffs:
    qb: 24
    rb: 24
    wr: 24
    te: 12

spring:
  application:
    name: otto
  ai:
    openai:
      api-key: "${OPENAI_API_KEY:unset}"
      chat:
        options:
          model: "gpt-5.6-luna"
          # The Ask loop offers the model a tool on every call, and this
          # model refuses tools on the chat-completions endpoint unless
          # reasoning is off. It is also what this assistant wants: the
          # thinking is done in Java, and the model only writes the
          # sentence, so reasoning effort buys latency and nothing else.
          reasoning-effort: "none"
