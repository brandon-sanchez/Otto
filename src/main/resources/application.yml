otto:
  league-id: "1389748403805650944"
  user-id: "992365876382924800"
  storage-dir: "./data"
  sleeper:
    base-url: "https://api.sleeper.app"
  telegram:
    base-url: "https://api.telegram.org"
    bot-token: "${TELEGRAM_BOT_TOKEN:}"
    chat-id: "${TELEGRAM_CHAT_ID:}"
    webhook-secret: "${TELEGRAM_WEBHOOK_SECRET:}"
  nflverse:
    api-base-url: "https://api.github.com"
    download-base-url: "https://github.com"
    player-ids-base-url: "https://raw.githubusercontent.com"
    check-interval: 1h
  market:
    fantasy-calc-base-url: "https://api.fantasycalc.com"
    dynasty-process-base-url: "https://raw.githubusercontent.com"
  team-sites:
    # Where each team's site lives; {host} is the host in OfficialTeams.
    url-template: "https://www.{host}"
  directory-check-interval: 60s
  pre-draft-check-interval: 24h
  # How often the Check reads the owner's league list again, so a league
  # he joins mid-season is followed the same day.
  league-discovery-interval: 6h
  # How stale a cached Sleeper read may be before a reader that is not
  # the Check goes back to the wire. It matches the Check's poll
  # interval: the Check keeps the cache filled, and the Freshness
  # Ceiling means a fresh poll would not be fresher anyway.
  sleeper-cadence: 60s
  edge-threshold: 1.0
  # Which waiver board reaches the chat: EVIDENCE or SCORED. Both are
  # built every round, so SCORED is the rollback; docs/deploy.md has the
  # steps.
  sent-waiver-board: EVIDENCE
  models:
    order: [openai, anthropic, gemini]
    breaker:
      failures: 3
      cooldown: 5m
    budgets:
      ask:
        deadline: 45s
        reserve: 10s
      advice:
        deadline: 150s
        reserve: 40s
      phrasing:
        deadline: 30s
        reserve: 8s
      check: 240s
    anthropic:
      api-key: "${ANTHROPIC_API_KEY:}"
      base-url: "https://api.anthropic.com"
      model: "claude-sonnet-5-5"
      timeout: 45s
      max-retries: 1
    gemini:
      api-key: "${GEMINI_API_KEY:}"
      base-url: "https://generativelanguage.googleapis.com"
      model: "gemini-3.8-flash"
      timeout: 45s
      max-retries: 1
  # A dropped player inside these ranks of the weekly projection table is
  # league news. The quarterback line stays at 12: this league starts two
  # of them, so a top-12 quarterback is a starter on most rosters.
  notable-cutoffs:
    qb: 12
    rb: 24
    wr: 24
    te: 12
  # The fallback replacement rank for a position the league document
  # gives no dedicated starting slot. Every other position reads its rank
  # from the league's own lineup: one player for every dedicated starting
  # slot, Superflex counted at quarterback.
  replacement-cutoffs:
    qb: 24
    rb: 24
    wr: 24
    te: 12

spring:
  application:
    name: otto
  ai:
    openai:
      api-key: "${OPENAI_API_KEY:unset}"
      timeout: 45s
      max-retries: 1
      chat:
        options:
          model: "gpt-5.6-luna"
          # The Ask loop offers the model a tool on every call, and this
          # model refuses tools on the chat-completions endpoint unless
          # reasoning is off. It is also what this assistant wants: the
          # thinking is done in Java, and the model only writes the
          # sentence, so reasoning effort buys latency and nothing else.
          reasoning-effort: "none"
